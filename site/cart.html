<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giỏ hàng | Hasaki.vn</title>
  <script>
  (function(){
    var K=['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id','fbclid','ttclid','gclid','adset_id','campaign_id','sub1','sub2','sub3','sub4','sub5'];
    function grab(q){var o={},p=(q||'').replace(/^\?/,'').split('&');for(var i=0;i<p.length;i++){var kv=p[i].split('=');if(kv.length<2)continue;try{var k=decodeURIComponent(kv[0]);if(K.indexOf(k)!==-1)o[k]=decodeURIComponent(kv.slice(1).join('='));}catch(e){}}return o;}
    function load(){try{return JSON.parse(sessionStorage.getItem('bp_utm')||'{}')}catch(e){return {}}}
    function save(o){try{sessionStorage.setItem('bp_utm',JSON.stringify(o))}catch(e){}try{var d=new Date();d.setTime(d.getTime()+7*864e5);document.cookie='bp_utm='+encodeURIComponent(JSON.stringify(o))+'; expires='+d.toUTCString()+'; path=/; SameSite=Lax';}catch(e){}}
    var cur=load(),add=false;var m=grab(location.search);for(var a in m){cur[a]=m[a];add=true}
    try{var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(n&&n.name){var mm=grab(n.name.split('?')[1]||'');for(var b in mm){cur[b]=mm[b];add=true}}}catch(e){}
    try{if(document.referrer){var mm2=grab((document.referrer.split('?')[1])||'');for(var c in mm2){if(!cur[c]){cur[c]=mm2[c];add=true}}}}catch(e){}
    if(add)save(cur);window.__BP_UTM__=cur;
  })();
  </script>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/base.css">
  <script src="/assets/app.js" defer></script>
  <script src="/assets/pixel.js" defer></script>
  <script src="/assets/cart.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <div class="crumb"><a href="/">Trang chủ</a><span>&rsaquo;</span><span>Giỏ hàng</span></div>
    <div class="cart-layout">
      <div class="cart-box">
        <div class="between" style="margin-bottom:6px"><h1 style="font-size:17px">Giỏ hàng của bạn</h1><span id="cart-count-txt" style="font-size:12.5px;color:#777"></span></div>
        <div id="cart-rows"></div>
      </div>
      <div>
        <div class="sum-box">
          <b style="font-size:15px">Tóm tắt đơn hàng</b>
          <div class="sum-line" style="margin-top:10px"><span>Tạm tính (giá gốc)</span><span id="sum-market">0 ₫</span></div>
          <div class="sum-line"><span>Tiết kiệm</span><span id="sum-save" style="color:#25bc4e">0 ₫</span></div>
          <div class="sum-line"><span>Phí vận chuyển</span><span>Miễn phí</span></div>
          <div class="sum-total"><span>Tổng cộng</span><span id="sum-total">0 ₫</span></div>
          <a class="btn btn-orange btn-block" href="/checkout" style="margin-top:10px">Tiến hành thanh toán</a>
          <a class="btn btn-outline btn-block btn-sm" href="/catalog" style="margin-top:8px">Tiếp tục mua sắm</a>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
