<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký thành viên | Hasaki.vn</title>
  <script>
  (function(){
    var K=['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id','fbclid','ttclid','gclid','adset_id','campaign_id','sub1','sub2','sub3','sub4','sub5'];
    function grab(q){var o={},p=(q||'').replace(/^\?/,'').split('&');for(var i=0;i<p.length;i++){var kv=p[i].split('=');if(kv.length<2)continue;try{var k=decodeURIComponent(kv[0]);if(K.indexOf(k)!==-1)o[k]=decodeURIComponent(kv.slice(1).join('='));}catch(e){}}return o;}
    function load(){try{return JSON.parse(sessionStorage.getItem('bp_utm')||'{}')}catch(e){return {}}}
    function save(o){try{sessionStorage.setItem('bp_utm',JSON.stringify(o))}catch(e){}try{var d=new Date();d.setTime(d.getTime()+7*864e5);document.cookie='bp_utm='+encodeURIComponent(JSON.stringify(o))+'; expires='+d.toUTCString()+'; path=/; SameSite=Lax';}catch(e){}}
    var cur=load(),add=false;var m=grab(location.search);for(var a in m){cur[a]=m[a];add=true}
    try{var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(n&&n.name){var mm=grab(n.name.split('?')[1]||'');for(var b in mm){cur[b]=mm[b];add=true}}}catch(e){}
    try{if(document.referrer){var mm2=grab((document.referrer.split('?')[1])||'');for(var c in mm2){if(!cur[c]){cur[c]=mm2[c];add=true}}}}catch(e){}
    if(add)save(cur);window.__BP_UTM__=cur;
  })();
  </script>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/base.css">
  <script src="/assets/app.js" defer></script>
  <script src="/assets/pixel.js" defer></script>
  <script src="/assets/auth.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <div class="co-box" style="max-width:640px;margin:26px auto">
      <h1 style="font-size:20px;margin-bottom:6px">Đăng ký thành viên Hasaki</h1>
      <p style="color:#777;font-size:13px;margin-bottom:16px">Thành viên mới nhận ngay voucher 50.000 ₫ cho đơn hàng đầu tiên.</p>
      <form id="reg-form">
        <div class="form-grid-2">
          <div class="field"><label for="rg-name">Họ và tên</label><input id="rg-name" name="name" autocomplete="name" placeholder="Nguyễn Văn A" required></div>
          <div class="field"><label for="rg-phone">Số điện thoại</label><input id="rg-phone" name="phone" autocomplete="tel" placeholder="09xx xxx xxx" required></div>
        </div>
        <div class="field"><label for="rg-email">Email</label><input id="rg-email" name="email" type="email" autocomplete="email" placeholder="email@example.com" required></div>
        <div class="form-grid-2">
          <div class="field"><label for="rg-pass">Mật khẩu</label><input id="rg-pass" name="password" type="password" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự" required></div>
          <div class="field"><label for="rg-pass2">Nhập lại mật khẩu</label><input id="rg-pass2" name="password2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required></div>
        </div>
        <div class="form-grid-2">
          <div class="field"><label for="rg-city">Tỉnh / Thành phố</label>
            <select id="rg-city" name="city" autocomplete="address-level1">
              <option>TP. Hồ Chí Minh</option><option>Hà Nội</option><option>Đà Nẵng</option>
              <option>Cần Thơ</option><option>Hải Phòng</option><option>Bình Dương</option><option>Đồng Nai</option>
            </select>
          </div>
          <div class="field"><label for="rg-zip">Mã bưu chính</label><input id="rg-zip" name="zip" autocomplete="postal-code" placeholder="700000"></div>
        </div>
        <div class="field"><label for="rg-addr">Địa chỉ</label><input id="rg-addr" name="addr" autocomplete="address-line1" placeholder="Số nhà, tên đường, phường/xã"></div>
        <label class="check" style="margin:6px 0 14px"><input type="checkbox" id="rg-terms" required> Tôi đồng ý với <a href="/policy?slug=terms" style="color:#306e51">Điều khoản</a> và <a href="/policy?slug=privacy" style="color:#306e51">Chính sách bảo mật</a></label>
        <button class="btn btn-green btn-block" type="submit">Đăng ký</button>
        <div id="auth-error" role="alert" style="color:#d0021b;font-size:13px;margin-top:10px;min-height:18px"></div>
      </form>
      <div style="margin-top:16px;font-size:13px;color:#777;text-align:center">
        Đã có tài khoản? <a href="/login" style="color:#306e51;font-weight:600">Đăng nhập</a>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
