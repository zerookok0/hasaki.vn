name = "hasaki-vn-clone"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# 部署：
#   npx wrangler pages deploy dist --project-name hasaki-vn-clone
# 或在 Cloudflare 面板接 GitHub 仓库：
#   Build command:      npm run build
#   Output directory:   dist
#   Node version:       22（环境变量 NODE_VERSION=22）
#
# 环境变量（可选）：
#   PANEL_ORIGIN=https://annangourmet.makeup     # 仅当 bp/config.json 的 enable_verify=true 时需要
